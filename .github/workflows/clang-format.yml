name: Clang Format

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-17

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"

      - name: Check formatting
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.c' '*.h' '*.cpp' '*.hpp')
          if [ -z "$FILES" ]; then
            echo "No C/C++ files changed"
            exit 0
          fi

          echo "$FILES" | xargs -d "\n" clang-format-17 -i
          git diff --exit-code
