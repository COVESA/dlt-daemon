name: SBOM Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sbom-check:
    name: SPDX/SBOM Header Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check SPDX headers in all source files
        run: |
          set -e

          FAILED=0

          # Check all C/C++ source files in src/, include/, tests/
          while IFS= read -r FILE
          do
            [ -z "$FILE" ] && continue

            if ! grep -q "SPDX-License-Identifier:" "$FILE"
            then
              echo "Missing SPDX header: $FILE"
              FAILED=1
            fi
          done < <(find src/ include/ tests/ -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \) 2>/dev/null)

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "SBOM check failed: some source files are missing SPDX-License-Identifier headers."
            echo "Add 'SPDX-License-Identifier: MPL-2.0' to each file's header."
            exit 1
          fi

          echo "All source files have SPDX-License-Identifier headers."
