name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build, Test, Coverage, ASan & Valgrind
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare submodule
      run: |
          git submodule init
          git submodule update

    - name: Build code-quality container
      run: docker build -t dlt-daemon-ci docker/

    # ------------------------------------------------------------------
    # Phase 1: Coverage
    # ------------------------------------------------------------------
    - name: Build & Test (Coverage)
      run: ./docker/run.sh coverage

    - name: Archive coverage results
      uses: actions/upload-artifact@v4
      with:
        name: dlt_coverage_report
        path: ${{github.workspace}}/dlt_lcov_report

    - name: Upload lcov report
      if: github.ref == 'refs/heads/master'
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git checkout -b dlt_coverage_report
        git submodule deinit -f googletest
        rm -rf .git/modules/googletest
        git rm -f googletest
        git add --all
        git commit -m "Upload lcov report for dlt-daemon"
        git push -f origin dlt_coverage_report

    # ------------------------------------------------------------------
    # Phase 2: AddressSanitizer
    # ------------------------------------------------------------------
    - name: Build & Test (ASan)
      run: ./docker/run.sh asan

    # ------------------------------------------------------------------
    # Phase 3: Valgrind
    # ------------------------------------------------------------------
    - name: Test (Valgrind)
      run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace dlt-daemon-ci \
            bash -c 'cd build-asan && ctest -C Debug \
              --rerun-failed \
              --output-on-failure \
              --overwrite MemoryCheckCommand=valgrind \
              --test-action memcheck || true'

    - name: Valgrind summary
      run: |
          echo "=== Valgrind results ==="
          if ls build-asan/Testing/Temporary/MemoryChecker.*.log 2>/dev/null; then
            cat build-asan/Testing/Temporary/MemoryChecker.*.log
          else
            echo "No memory errors detected."
          fi
